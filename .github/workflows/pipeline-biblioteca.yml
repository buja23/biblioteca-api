name: Pipeline Biblioteca API

on:
  push:
    branches: [main, '**']
  pull_request:
    branches: [main]

jobs:
  test:
    name: test
    uses: on.workflow_call


  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test

  integration-tests:
    name: integration-tests
    runs-on: ubuntu-latest
    needs: [test, unit-tests]
    env:
      POSTGRES_PASSWORD: crud_password
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create CI environment
        run: cp .env.example .env
      - name: Start Docker Compose
        run: docker compose up -d --build
      - name: Run health, connectivity and smoke tests
        run: |
          for attempt in $(seq 1 30); do
            curl --fail --silent http://localhost:3000/health && break
            test "$attempt" -lt 30 || exit 1
            sleep 2
          done
          curl --fail --silent http://localhost:3000/health | jq -e '.status == "ok" and .db == "connected"'
          docker compose exec -T web getent hosts db
          docker compose exec -T web sh -c 'nc -z db 5432'
          docker compose exec -T db pg_isready -U crud_user -d crud_db
          curl --fail --silent http://localhost:3000/items | jq -e 'type == "array"'
          item=$(curl --fail --silent --request POST http://localhost:3000/items --header 'Content-Type: application/json' --data '{"name":"pipeline item"}')
          id=$(printf '%s' "$item" | jq -r '.id')
          curl --fail --silent "http://localhost:3000/items/$id" | jq -e --arg id "$id" '.id == ($id | tonumber)'
          curl --fail --silent --request DELETE "http://localhost:3000/items/$id" | jq -e '.item.id'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:3000/rota-inexistente)" = "404"
      - name: Stop Docker Compose
        if: always()
        run: docker compose down -v

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [test, unit-tests, integration-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/biblioteca-api:latest 