name: Exercício 7 - Pipeline Biblioteca API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Criar o .env com a senha do secret
        env:
          SENHA: ${{ secrets.POSTGRES_PASSWORD_CI }}
        run: |
          cp .env.example .env
          test -n "$SENHA" || { echo "Configure o secret POSTGRES_PASSWORD_CI."; exit 1; }
          python3 - <<'PY'
          import os
          from pathlib import Path

          senha = os.environ["SENHA"]
          if "\n" in senha or "\r" in senha:
              raise SystemExit("A senha deve ter uma única linha.")
          valor = "'" + senha.replace("'", "\\'") + "'"
          arquivo = Path(".env")
          linhas = arquivo.read_text().splitlines()
          arquivo.write_text("\n".join(
              "POSTGRES_PASSWORD=" + valor if linha.startswith("POSTGRES_PASSWORD=") else linha
              for linha in linhas
          ) + "\n")
          PY

      - name: Validar o Compose
        run: docker compose config -q

      - name: Subir o ambiente
        run: docker compose up -d --build

      - name: Aguardar a API (30 tentativas de 2 segundos)
        run: |
          for tentativa in $(seq 1 30); do
            if curl --fail --silent --max-time 2 http://localhost:3000/health > /dev/null; then
              exit 0
            fi
            if [ "$tentativa" -lt 30 ]; then
              sleep 2
            fi
          done
          echo "A API não ficou disponível após 30 tentativas."
          exit 1

      - name: Health check - HTTP 200, status ok e banco conectado
        run: |
          status=$(curl --silent --show-error --max-time 5 --output health.json --write-out '%{http_code}' http://localhost:3000/health)
          test "$status" = "200"
          jq -e '.status == "ok" and .db == "connected"' health.json

      - name: GET /livros - HTTP 200 e array não vazio
        run: |
          status=$(curl --silent --show-error --max-time 5 --output livros.json --write-out '%{http_code}' http://localhost:3000/livros)
          test "$status" = "200"
          jq -e 'type == "array" and length > 0' livros.json

      - name: Rota inexistente - HTTP 404
        run: |
          status=$(curl --silent --show-error --max-time 5 --output /dev/null --write-out '%{http_code}' http://localhost:3000/nao-existe)
          test "$status" = "404"

      - name: Coletar logs em caso de falha
        if: failure()
        run: |
          mkdir -p logs
          docker compose logs --no-color > logs/compose.log 2>&1

      - name: Publicar artifact dos logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-compose-${{ github.run_id }}-${{ github.run_attempt }}
          path: logs/compose.log
          if-no-files-found: error
          retention-days: 7

      - name: Derrubar o ambiente sempre
        if: always()
        run: docker compose down -v


  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir e publicar as tags latest e SHA
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/biblioteca-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/biblioteca-api:${{ github.sha }}
