name: Exercício 3 - Loja API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Criar o .env
        run: cp .env.example .env

      - name: Subir o ambiente
        run: docker compose up -d --build

      - name: Aguardar a API (20 tentativas de 3 segundos)
        run: |
          for tentativa in $(seq 1 20); do
            if curl --fail --silent --max-time 3 http://localhost:8080/status > /dev/null; then
              exit 0
            fi
            if [ "$tentativa" -lt 20 ]; then
              sleep 3
            fi
          done
          echo "A Loja API não ficou disponível após 20 tentativas."
          exit 1

      - name: Verificar o corpo de /status
        run: |
          curl --fail --silent --show-error --max-time 5 http://localhost:8080/status \
            | jq -e '.estado == "ativo"'

      - name: Verificar se o PostgreSQL aceita conexões
        run: docker compose exec -T banco sh -c 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'

      - name: Derrubar o ambiente sempre
        if: always()
        run: docker compose down -v
